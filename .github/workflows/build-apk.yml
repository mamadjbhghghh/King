name: Build Acode APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Acode
        run: |
          mkdir source
          unzip -q Acode_1.13.5_Native_Engines_Integrated_Source_v0.1.0.zip -d source
          test -f source/Acode-1.13.5/package.json

      - name: Install dependencies
        working-directory: source/Acode-1.13.5
        run: npm ci --no-audit --no-fund

      - name: Build APK
        working-directory: source/Acode-1.13.5
        run: npm run build -- paid dev apk

      - name: Find APK
        id: apk
        run: |
          APK=$(find source/Acode-1.13.5/platforms/android \
            -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Acode-Native-Engines-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7